name: update-data

on:
  schedule:
    # 21:30 and 23:30 Beijing time, weekdays (fund NAVs are published in the evening)
    - cron: "30 13 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas numpy

      - name: Rebuild data.json
        run: python builder/build_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data unchanged"
          else
            git commit -m "data: auto update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
